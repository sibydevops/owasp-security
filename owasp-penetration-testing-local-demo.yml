name: OWASP Penetration Testing
run-name: OWASP Pen Test ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}@${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_repository:
        description: owner/repository to test
        required: true
        type: string
      target_sha:
        description: Exact commit SHA to assess
        required: true
        type: string
      app_type:
        description: Application type
        required: false
        default: auto
        type: choice
        options: [auto, web, api, cloud-native, desktop, library]
      target_url:
        description: Optional authorized non-production URL; empty uses local Juice Shop
        required: false
        type: string
      openapi_url:
        description: OpenAPI URL for API mode
        required: false
        type: string
      dast_mode:
        description: DAST mode
        required: false
        default: baseline
        type: choice
        options: [baseline, full, api, none]
  repository_dispatch:
    types: [owasp-pen-test]
  workflow_call:
    inputs:
      target_repository: {required: true, type: string}
      target_sha: {required: true, type: string}
      app_type: {required: false, default: auto, type: string}
      target_url: {required: false, default: '', type: string}
      openapi_url: {required: false, default: '', type: string}
      dast_mode: {required: false, default: baseline, type: string}
    secrets:
      SECURITY_REPO_TOKEN: {required: false}

concurrency:
  group: owasp-${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}-${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  DEFAULT_APP_TYPE: ${{ vars.DEFAULT_APP_TYPE || 'auto' }}
  DEFAULT_DAST_MODE: ${{ vars.DEFAULT_DAST_MODE || 'baseline' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.out.outputs.repository }}
      sha: ${{ steps.out.outputs.sha }}
      app_type: ${{ steps.out.outputs.app_type }}
      target_url: ${{ steps.out.outputs.target_url }}
      openapi_url: ${{ steps.out.outputs.openapi_url }}
      dast_mode: ${{ steps.out.outputs.dast_mode }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        name: Normalize and validate inputs
        env:
          REPO: ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}
          SHA: ${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}
          APP: ${{ inputs.app_type || github.event.client_payload.app_type || vars.DEFAULT_APP_TYPE || 'auto' }}
          URL: ${{ inputs.target_url || github.event.client_payload.target_url || vars.DAST_TARGET_URL }}
          OPENAPI: ${{ inputs.openapi_url || github.event.client_payload.openapi_url || vars.DAST_OPENAPI_URL }}
          MODE: ${{ inputs.dast_mode || github.event.client_payload.dast_mode || vars.DEFAULT_DAST_MODE || 'baseline' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          [[ "$APP" =~ ^(auto|web|api|cloud-native|desktop|library)$ ]] || exit 1
          [[ "$MODE" =~ ^(baseline|full|api|none)$ ]] || exit 1
          [[ "$MODE" != api || -n "$OPENAPI" ]] || { echo "::error::openapi_url required for api mode"; exit 1; }
          echo "repository=$REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "app_type=$APP" >> "$GITHUB_OUTPUT"
          echo "target_url=$URL" >> "$GITHUB_OUTPUT"
          echo "openapi_url=$OPENAPI" >> "$GITHUB_OUTPUT"
          echo "dast_mode=$MODE" >> "$GITHUB_OUTPUT"

  app-prep:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact target
        env:
          GH_TOKEN: ${{ secrets.SECURITY_REPO_TOKEN || github.token }}
          REPO: ${{ needs.validate.outputs.repository }}
          SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init target
          git -C target remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git -C target fetch --depth 1 origin "$SHA"
          git -C target checkout --detach FETCH_HEAD
          [[ "$(git -C target rev-parse HEAD)" == "$SHA" ]]
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-target-${{ needs.validate.outputs.sha }}
          path: target/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sast:
    needs: [validate, app-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-target-${{ needs.validate.outputs.sha }}
          path: target
      - name: Run Semgrep CE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 -m pip install --disable-pip-version-check semgrep
          semgrep scan --config auto --json --output reports/semgrep.json target || true
          test -s reports/semgrep.json
      - name: Map findings
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/map-findings.py reports/semgrep.json reports
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  dast:
    needs: [validate, app-prep, sast]
    if: ${{ needs.validate.outputs.dast_mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXTERNAL_TARGET_URL: ${{ needs.validate.outputs.target_url }}
      OPENAPI_URL: ${{ needs.validate.outputs.openapi_url }}
      DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
      LOCAL_TARGET_URL: http://127.0.0.1:3000
      JUICE_SHOP_IMAGE: bkimminich/juice-shop:latest
      JUICE_SHOP_CONTAINER: owasp-dast-target
    steps:
      - uses: actions/checkout@v4
      - id: target
        name: Select target
        shell: bash
        run: |
          if [[ -n "$EXTERNAL_TARGET_URL" ]]; then
            echo "type=external" >> "$GITHUB_OUTPUT"; echo "url=$EXTERNAL_TARGET_URL" >> "$GITHUB_OUTPUT"
          else
            echo "type=local-demo" >> "$GITHUB_OUTPUT"; echo "url=$LOCAL_TARGET_URL" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate external target
        if: ${{ steps.target.outputs.type == 'external' }}
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          ALLOWED_TARGET_SUFFIXES: ${{ vars.ALLOWED_TARGET_SUFFIXES }}
        run: bash scripts/validate-target.sh
      - name: Start isolated Juice Shop
        if: ${{ steps.target.outputs.type == 'local-demo' }}
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name "$JUICE_SHOP_CONTAINER" -p 127.0.0.1:3000:3000 --memory 1g --cpus 2 --security-opt no-new-privileges:true --cap-drop ALL "$JUICE_SHOP_IMAGE"
      - name: Wait for target
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          for i in {1..30}; do curl -fsS "$TARGET_URL" >/dev/null && exit 0; sleep 5; done
          docker logs "$JUICE_SHOP_CONTAINER" 2>/dev/null || true
          exit 1
      - name: Run ZAP
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: bash scripts/run-zap.sh reports
      - name: Map ZAP findings
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/map-zap.py reports/zap.json reports
      - name: Capture target logs
        if: ${{ always() && steps.target.outputs.type == 'local-demo' }}
        run: mkdir -p reports; docker logs "$JUICE_SHOP_CONTAINER" > reports/juice-shop.log 2>&1 || true
      - name: Stop target
        if: ${{ always() && steps.target.outputs.type == 'local-demo' }}
        run: docker rm -f "$JUICE_SHOP_CONTAINER" || true
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: [validate, sast, dast]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-reports-${{ needs.validate.outputs.sha }}'
          path: reports
          merge-multiple: true
      - name: Build YAML summary
        env:
          REPO: ${{ needs.validate.outputs.repository }}
          SHA: ${{ needs.validate.outputs.sha }}
          MODE: ${{ needs.validate.outputs.dast_mode }}
          SAST_RESULT: ${{ needs.sast.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=Path('reports'); r.mkdir(exist_ok=True)
          def load(n):
              p=r/n
              try: return json.loads(p.read_text()) if p.exists() else {}
              except Exception: return {}
          s=load('semgrep.json'); z=load('zap.json')
          q=lambda v:'"'+str(v or '').replace('\\','\\\\').replace('"','\\"')+'"'
          lines=['assessment:',f'  repository: {q(os.getenv("REPO"))}',f'  sha: {q(os.getenv("SHA"))}',f'  dast_mode: {q(os.getenv("MODE"))}','jobs:',f'  sast: {q(os.getenv("SAST_RESULT"))}',f'  dast: {q(os.getenv("DAST_RESULT"))}','sast:',f'  findings: {len(s.get("results",[]))}','dast:',f'  sites: {len(z.get("site",[]))}']
          (r/'owasp-pen-test-summary.yaml').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: owasp-pen-test-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: [validate, sast, dast, summary]
    if: ${{ always() && needs.summary.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: owasp-pen-test-${{ needs.validate.outputs.sha }}
          path: all-reports
      - name: Require successful scanners
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        shell: bash
        run: |
          [[ "$SAST_RESULT" == success ]] || exit 1
          [[ "$DAST_MODE" == none || "$DAST_RESULT" == success ]] || exit 1
      - name: Apply policy gate
        env:
          FAIL_ON_SAST: ${{ vars.FAIL_ON_SAST || 'ERROR' }}
          FAIL_ON_ZAP_RISK: ${{ vars.FAIL_ON_ZAP_RISK || 'NONE' }}
        run: python3 scripts/security-gate.py all-reports
