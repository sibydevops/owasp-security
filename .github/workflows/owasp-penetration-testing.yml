name: OWASP Penetration Testing

run-name: >-
  OWASP Pen Test ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}@${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      target_repository:
        description: owner/repository to test
        required: true
        type: string

      target_sha:
        description: Exact 40-character commit SHA to assess
        required: true
        type: string

      app_type:
        description: Application type
        required: false
        default: auto
        type: choice
        options:
          - auto
          - web
          - api
          - cloud-native
          - desktop
          - library

      target_url:
        description: Optional authorized test URL; empty uses local Juice Shop
        required: false
        type: string

      openapi_url:
        description: OpenAPI URL for API scan mode
        required: false
        type: string

      dast_mode:
        description: DAST mode
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - full
          - api
          - none

  repository_dispatch:
    types:
      - owasp-pen-test

  workflow_call:
    inputs:
      target_repository:
        description: owner/repository to test
        required: true
        type: string

      target_sha:
        description: Exact 40-character commit SHA to assess
        required: true
        type: string

      app_type:
        description: Application type
        required: false
        default: auto
        type: string

      target_url:
        description: Optional authorized test URL
        required: false
        default: ""
        type: string

      openapi_url:
        description: OpenAPI URL for API scan mode
        required: false
        default: ""
        type: string

      dast_mode:
        description: DAST mode
        required: false
        default: baseline
        type: string

    secrets:
      SECURITY_REPO_TOKEN:
        description: Token for cloning an authorized private repository
        required: false

concurrency:
  group: >-
    owasp-${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}-${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      repository: ${{ steps.inputs.outputs.repository }}
      sha: ${{ steps.inputs.outputs.sha }}
      app_type: ${{ steps.inputs.outputs.app_type }}
      target_url: ${{ steps.inputs.outputs.target_url }}
      openapi_url: ${{ steps.inputs.outputs.openapi_url }}
      dast_mode: ${{ steps.inputs.outputs.dast_mode }}

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Normalize and validate inputs
        id: inputs
        env:
          TARGET_REPOSITORY: >-
            ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}

          TARGET_SHA: >-
            ${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}

          APP_TYPE: >-
            ${{ inputs.app_type || github.event.client_payload.app_type || vars.DEFAULT_APP_TYPE || 'auto' }}

          TARGET_URL: >-
            ${{ inputs.target_url || github.event.client_payload.target_url || vars.DAST_TARGET_URL }}

          OPENAPI_URL: >-
            ${{ inputs.openapi_url || github.event.client_payload.openapi_url || vars.DAST_OPENAPI_URL }}

          DAST_MODE: >-
            ${{ inputs.dast_mode || github.event.client_payload.dast_mode || vars.DEFAULT_DAST_MODE || 'baseline' }}

        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid repository: $TARGET_REPOSITORY"
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Target SHA must be an exact 40-character SHA"
            exit 1
          fi

          case "$APP_TYPE" in
            auto|web|api|cloud-native|desktop|library)
              ;;
            *)
              echo "::error::Unsupported application type: $APP_TYPE"
              exit 1
              ;;
          esac

          case "$DAST_MODE" in
            baseline|full|api|none)
              ;;
            *)
              echo "::error::Unsupported DAST mode: $DAST_MODE"
              exit 1
              ;;
          esac

          if [[ "$DAST_MODE" == "api" && -z "$OPENAPI_URL" ]]; then
            echo "::error::openapi_url is required for API scan mode"
            exit 1
          fi

          {
            echo "repository=$TARGET_REPOSITORY"
            echo "sha=$TARGET_SHA"
            echo "app_type=$APP_TYPE"
            echo "target_url=$TARGET_URL"
            echo "openapi_url=$OPENAPI_URL"
            echo "dast_mode=$DAST_MODE"
          } >> "$GITHUB_OUTPUT"

          echo "Repository: $TARGET_REPOSITORY"
          echo "SHA: $TARGET_SHA"
          echo "Application type: $APP_TYPE"
          echo "DAST mode: $DAST_MODE"

          if [[ -n "$TARGET_URL" ]]; then
            echo "DAST target type: external"
          else
            echo "DAST target type: isolated local OWASP Juice Shop"
          fi

      - name: Create validation YAML report
        env:
          TARGET_REPOSITORY: ${{ steps.inputs.outputs.repository }}
          TARGET_SHA: ${{ steps.inputs.outputs.sha }}
          APP_TYPE: ${{ steps.inputs.outputs.app_type }}
          DAST_MODE: ${{ steps.inputs.outputs.dast_mode }}
          TARGET_URL: ${{ steps.inputs.outputs.target_url }}
          OPENAPI_URL: ${{ steps.inputs.outputs.openapi_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p validation-reports

          python3 - <<'PY'
          import os
          from pathlib import Path

          def quote(value):
              text = str(value or "")
              return (
                  '"'
                  + text.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  + '"'
              )

          target_url = os.getenv("TARGET_URL", "")
          target_type = "external" if target_url else "local-demo"

          lines = [
              "validation:",
              f"  repository: {quote(os.getenv('TARGET_REPOSITORY'))}",
              f"  sha: {quote(os.getenv('TARGET_SHA'))}",
              f"  app_type: {quote(os.getenv('APP_TYPE'))}",
              f"  dast_mode: {quote(os.getenv('DAST_MODE'))}",
              f"  target_type: {quote(target_type)}",
              f"  target_url: {quote(target_url)}",
              f"  openapi_url: {quote(os.getenv('OPENAPI_URL'))}",
              '  status: "success"',
          ]

          Path(
              "validation-reports/validation.yaml"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ steps.inputs.outputs.sha }}
          path: validation-reports/
          if-no-files-found: error
          retention-days: 30

  app-prep:
    name: Prepare application
    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      detected_app_type: ${{ steps.detect.outputs.app_type }}

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Clone exact target commit
        env:
          GH_TOKEN: ${{ secrets.SECURITY_REPO_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/clone-target.sh ]]; then
            bash scripts/clone-target.sh
          else
            rm -rf target
            git init target

            git -C target remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"

            git -C target fetch \
              --depth 1 \
              origin \
              "$TARGET_SHA"

            git -C target checkout \
              --detach \
              FETCH_HEAD
          fi

          actual_sha="$(git -C target rev-parse HEAD)"

          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Cloned SHA $actual_sha does not match $TARGET_SHA"
            exit 1
          fi

          echo "Target repository cloned at $actual_sha"

      - name: Detect application type
        id: detect
        env:
          REQUESTED_APP_TYPE: ${{ needs.validate.outputs.app_type }}
        shell: bash
        run: |
          set -euo pipefail

          detected="$REQUESTED_APP_TYPE"

          if [[ -f scripts/detect-app.sh ]]; then
            bash scripts/detect-app.sh target | tee detection.env

            script_detected="$(
              sed -n 's/^APP_TYPE=//p' detection.env |
              tail -n 1
            )"

            if [[ -n "$script_detected" ]]; then
              detected="$script_detected"
            fi
          else
            echo "APP_TYPE=$detected" | tee detection.env
          fi

          case "$detected" in
            auto|web|api|cloud-native|desktop|library)
              ;;
            *)
              echo "::error::Unsupported detected application type: $detected"
              exit 1
              ;;
          esac

          echo "app_type=$detected" >> "$GITHUB_OUTPUT"
          echo "Detected application type: $detected"

      - name: Create preparation YAML report
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
          DETECTED_APP_TYPE: ${{ steps.detect.outputs.app_type }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p prep-reports

          python3 - <<'PY'
          import os
          from pathlib import Path

          def quote(value):
              text = str(value or "")
              return (
                  '"'
                  + text.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  + '"'
              )

          lines = [
              "application_preparation:",
              f"  repository: {quote(os.getenv('TARGET_REPOSITORY'))}",
              f"  sha: {quote(os.getenv('TARGET_SHA'))}",
              (
                  "  detected_app_type: "
                  + quote(os.getenv("DETECTED_APP_TYPE"))
              ),
              '  clone_status: "success"',
          ]

          Path(
              "prep-reports/application-preparation.yaml"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload prepared target
        uses: actions/upload-artifact@v4
        with:
          name: prepared-target-${{ needs.validate.outputs.sha }}
          path: |
            target/
            detection.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload preparation reports
        uses: actions/upload-artifact@v4
        with:
          name: preparation-reports-${{ needs.validate.outputs.sha }}
          path: prep-reports/
          if-no-files-found: error
          retention-days: 30

  sast:
    name: Static application security testing
    needs:
      - validate
      - app-prep

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Download prepared target
        uses: actions/download-artifact@v4
        with:
          name: prepared-target-${{ needs.validate.outputs.sha }}
          path: .

      - name: Validate prepared target
        shell: bash
        run: |
          set -euo pipefail

          test -d target || {
            echo "::error::Prepared target directory is missing"
            exit 1
          }

      - name: Install Semgrep and YAML support
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            semgrep \
            pyyaml

          semgrep --version

      - name: Run Semgrep CE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          set +e

          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            target

          semgrep_exit_code=$?

          set -e

          echo "Semgrep exit code: $semgrep_exit_code"

          test -s reports/semgrep.json || {
            echo "::error::Semgrep did not produce reports/semgrep.json"
            exit 1
          }

      - name: Convert Semgrep JSON to YAML
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          source = Path("reports/semgrep.json")
          output = Path("reports/semgrep.yaml")

          semgrep = json.loads(
              source.read_text(encoding="utf-8")
          )

          document = {
              "scan": {
                  "type": "sast",
                  "tool": "semgrep",
                  "repository": os.getenv(
                      "TARGET_REPOSITORY",
                      "",
                  ),
                  "sha": os.getenv(
                      "TARGET_SHA",
                      "",
                  ),
                  "generated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
              },
              "report": semgrep,
          }

          output.write_text(
              yaml.safe_dump(
                  document,
                  sort_keys=False,
                  allow_unicode=True,
                  default_flow_style=False,
              ),
              encoding="utf-8",
          )

          print(f"Generated {output}")
          PY

      - name: Validate and summarize Semgrep findings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(
              Path("reports/semgrep.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(report, dict):
              raise SystemExit(
                  "Semgrep report must be a JSON object"
              )

          findings = report.get("results", [])

          if not isinstance(findings, list):
              raise SystemExit(
                  "Semgrep results must be an array"
              )

          counts = Counter()

          for finding in findings:
              if not isinstance(finding, dict):
                  continue

              extra = finding.get("extra", {})

              if not isinstance(extra, dict):
                  extra = {}

              severity = str(
                  extra.get("severity", "INFO")
              ).strip().upper()

              counts[severity] += 1

          lines = [
              "# SAST Summary",
              "",
              f"- Total findings: {len(findings)}",
              f"- ERROR: {counts.get('ERROR', 0)}",
              f"- WARNING: {counts.get('WARNING', 0)}",
              f"- INFO: {counts.get('INFO', 0)}",
              "",
          ]

          Path(
              "reports/sast-summary.md"
          ).write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

          print("\n".join(lines))
          PY

      - name: Map findings to OWASP standards
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/map-findings.py ]]; then
            python3 scripts/map-findings.py \
              reports/semgrep.json \
              reports
          else
            echo "::warning::scripts/map-findings.py is missing"
          fi

      - name: Convert normalized SAST JSON to YAML
        shell: bash
        run: |
          set -euo pipefail

          if [[ -s reports/sast-normalized.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          import yaml

          source = Path(
              "reports/sast-normalized.json"
          )

          output = Path(
              "reports/sast-normalized.yaml"
          )

          data = json.loads(
              source.read_text(encoding="utf-8")
          )

          output.write_text(
              yaml.safe_dump(
                  data,
                  sort_keys=False,
                  allow_unicode=True,
                  default_flow_style=False,
              ),
              encoding="utf-8",
          )

          print(f"Generated {output}")
          PY
          else
            echo "::warning::sast-normalized.json was not generated"
          fi

      - name: Generate Edge-compatible SAST HTML report
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/generate-html-report.py ]]; then
            python3 scripts/generate-html-report.py \
              reports/semgrep.json \
              reports/sast-report.html
          else
            echo "::error::scripts/generate-html-report.py is missing"
            exit 1
          fi

          test -s reports/sast-report.html || {
            echo "::error::SAST HTML report was not generated"
            exit 1
          }

      - name: Validate SAST output files
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/semgrep.json
          test -s reports/semgrep.yaml
          test -s reports/sast-summary.md
          test -s reports/sast-report.html

          echo "SAST report files:"

          find reports \
            -maxdepth 2 \
            -type f \
            -print |
            sort

      - name: Upload SAST reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  dast:
    name: Dynamic application security testing
    needs:
      - validate
      - app-prep
      - sast

    if: ${{ needs.validate.outputs.dast_mode != 'none' }}

    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXTERNAL_TARGET_URL: ${{ needs.validate.outputs.target_url }}
      OPENAPI_URL: ${{ needs.validate.outputs.openapi_url }}
      DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
      LOCAL_TARGET_URL: http://127.0.0.1:3000
      JUICE_SHOP_IMAGE: bkimminich/juice-shop:latest
      JUICE_SHOP_CONTAINER: owasp-dast-target

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Install YAML support
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            pyyaml

      - name: Select DAST target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$EXTERNAL_TARGET_URL" ]]; then
            echo "type=external" >> "$GITHUB_OUTPUT"
            echo "url=$EXTERNAL_TARGET_URL" >> "$GITHUB_OUTPUT"
            echo "Using authorized external target"
          else
            echo "type=local-demo" >> "$GITHUB_OUTPUT"
            echo "url=$LOCAL_TARGET_URL" >> "$GITHUB_OUTPUT"
            echo "Using isolated local OWASP Juice Shop"
          fi

      - name: Validate external target
        if: ${{ steps.target.outputs.type == 'external' }}
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          ALLOWED_TARGET_SUFFIXES: ${{ vars.ALLOWED_TARGET_SUFFIXES }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/validate-target.sh ]]; then
            bash scripts/validate-target.sh
          else
            echo "::error::validate-target.sh is required for external targets"
            exit 1
          fi

      - name: Start isolated OWASP Juice Shop
        if: ${{ steps.target.outputs.type == 'local-demo' }}
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$JUICE_SHOP_IMAGE"

          docker run \
            --detach \
            --name "$JUICE_SHOP_CONTAINER" \
            --publish 127.0.0.1:3000:3000 \
            --memory 1g \
            --cpus 2 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "$JUICE_SHOP_IMAGE"

          docker ps \
            --filter "name=$JUICE_SHOP_CONTAINER"

      - name: Wait for DAST target
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$TARGET_URL" || true
            )"

            echo "Attempt $attempt: HTTP ${status:-unreachable}"

            if [[ "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "DAST target is reachable"
              exit 0
            fi

            sleep 5
          done

          echo "::error::DAST target did not become ready"

          docker logs \
            "$JUICE_SHOP_CONTAINER" \
            2>/dev/null || true

          exit 1

      - name: Run OWASP ZAP
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          bash scripts/run-zap.sh reports

      - name: Validate ZAP JSON report
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/zap.json || {
            echo "::error::ZAP did not generate reports/zap.json"
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("reports/zap.json").read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(report, dict):
              raise SystemExit(
                  "ZAP report must be a JSON object"
              )

          sites = report.get("site", [])

          if not isinstance(sites, list):
              raise SystemExit(
                  "ZAP site property must be an array"
              )

          alert_count = 0

          for site in sites:
              if not isinstance(site, dict):
                  continue

              alerts = site.get("alerts", [])

              if isinstance(alerts, list):
                  alert_count += len(alerts)

          print(f"Sites: {len(sites)}")
          print(f"Alerts: {alert_count}")
          PY

      - name: Convert ZAP JSON to YAML
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
          TARGET_URL: ${{ steps.target.outputs.url }}
          TARGET_TYPE: ${{ steps.target.outputs.type }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          source = Path("reports/zap.json")
          output = Path("reports/zap.yaml")

          zap = json.loads(
              source.read_text(encoding="utf-8")
          )

          document = {
              "scan": {
                  "type": "dast",
                  "tool": "owasp-zap",
                  "repository": os.getenv(
                      "TARGET_REPOSITORY",
                      "",
                  ),
                  "sha": os.getenv(
                      "TARGET_SHA",
                      "",
                  ),
                  "mode": os.getenv(
                      "DAST_MODE",
                      "",
                  ),
                  "target_type": os.getenv(
                      "TARGET_TYPE",
                      "",
                  ),
                  "target_url": os.getenv(
                      "TARGET_URL",
                      "",
                  ),
                  "generated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
              },
              "report": zap,
          }

          output.write_text(
              yaml.safe_dump(
                  document,
                  sort_keys=False,
                  allow_unicode=True,
                  default_flow_style=False,
              ),
              encoding="utf-8",
          )

          print(f"Generated {output}")
          PY

      - name: Map ZAP findings to WSTG and ASVS
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/map-zap.py ]]; then
            python3 scripts/map-zap.py \
              reports/zap.json \
              reports
          else
            echo "::warning::scripts/map-zap.py is missing"
          fi

      - name: Convert normalized DAST JSON to YAML
        shell: bash
        run: |
          set -euo pipefail

          normalized_file=""

          for candidate in \
            reports/dast-normalized.json \
            reports/zap-normalized.json
          do
            if [[ -s "$candidate" ]]; then
              normalized_file="$candidate"
              break
            fi
          done

          if [[ -n "$normalized_file" ]]; then
            NORMALIZED_FILE="$normalized_file" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          import yaml

          source = Path(os.environ["NORMALIZED_FILE"])
          output = source.with_suffix(".yaml")

          data = json.loads(
              source.read_text(encoding="utf-8")
          )

          output.write_text(
              yaml.safe_dump(
                  data,
                  sort_keys=False,
                  allow_unicode=True,
                  default_flow_style=False,
              ),
              encoding="utf-8",
          )

          print(f"Generated {output}")
          PY
          else
            echo "No normalized DAST JSON file was produced"
          fi

      - name: Generate DAST YAML summary
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          TARGET_TYPE: ${{ steps.target.outputs.type }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          import yaml

          report = json.loads(
              Path("reports/zap.json").read_text(
                  encoding="utf-8"
              )
          )

          counts = Counter()
          alert_count = 0

          sites = report.get("site", [])

          if not isinstance(sites, list):
              sites = []

          for site in sites:
              if not isinstance(site, dict):
                  continue

              alerts = site.get("alerts", [])

              if not isinstance(alerts, list):
                  continue

              for alert in alerts:
                  if not isinstance(alert, dict):
                      continue

                  alert_count += 1

                  risk = str(
                      alert.get("riskdesc")
                      or alert.get("risk")
                      or alert.get("riskcode")
                      or ""
                  ).strip().upper()

                  if "HIGH" in risk or risk == "3":
                      counts["high"] += 1
                  elif "MEDIUM" in risk or risk == "2":
                      counts["medium"] += 1
                  elif "LOW" in risk or risk == "1":
                      counts["low"] += 1
                  else:
                      counts["informational"] += 1

          summary = {
              "dast_summary": {
                  "tool": "owasp-zap",
                  "mode": os.getenv(
                      "DAST_MODE",
                      "",
                  ),
                  "target_type": os.getenv(
                      "TARGET_TYPE",
                      "",
                  ),
                  "target_url": os.getenv(
                      "TARGET_URL",
                      "",
                  ),
                  "sites": len(sites),
                  "alerts": alert_count,
                  "risk": {
                      "high": counts["high"],
                      "medium": counts["medium"],
                      "low": counts["low"],
                      "informational": (
                          counts["informational"]
                      ),
                  },
              }
          }

          Path(
              "reports/dast-summary.yaml"
          ).write_text(
              yaml.safe_dump(
                  summary,
                  sort_keys=False,
                  allow_unicode=True,
              ),
              encoding="utf-8",
          )
          PY

      - name: Capture local target logs
        if: >-
          ${{
            always() &&
            steps.target.outputs.type == 'local-demo'
          }}
        shell: bash
        run: |
          set +e

          mkdir -p reports

          docker logs "$JUICE_SHOP_CONTAINER" \
            > reports/juice-shop.log \
            2>&1

          docker inspect "$JUICE_SHOP_CONTAINER" \
            > reports/juice-shop-inspect.json \
            2>/dev/null

          exit 0

      - name: Stop isolated OWASP Juice Shop
        if: >-
          ${{
            always() &&
            steps.target.outputs.type == 'local-demo'
          }}
        shell: bash
        run: |
          set +e

          docker rm \
            --force \
            "$JUICE_SHOP_CONTAINER"

          exit 0

      - name: List DAST report files
        if: ${{ always() }}
        shell: bash
        run: |
          find reports \
            -maxdepth 3 \
            -type f \
            -print \
            2>/dev/null |
            sort || true

      - name: Upload DAST reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  dast-status:
    name: Explain DAST status
    needs:
      - validate
      - app-prep
      - sast
      - dast

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create DAST status YAML
        env:
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
          DAST_RESULT: ${{ needs.dast.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          TARGET_URL: ${{ needs.validate.outputs.target_url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p status-reports

          python3 - <<'PY'
          import os
          from pathlib import Path

          target_url = os.getenv("TARGET_URL", "")

          def quote(value):
              text = str(value or "")
              return (
                  '"'
                  + text.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  + '"'
              )

          lines = [
              "dast_status:",
              (
                  "  mode: "
                  + quote(os.getenv("DAST_MODE"))
              ),
              (
                  "  result: "
                  + quote(os.getenv("DAST_RESULT"))
              ),
              (
                  "  sast_result: "
                  + quote(os.getenv("SAST_RESULT"))
              ),
              (
                  "  target_type: "
                  + quote(
                      "external"
                      if target_url
                      else "local-demo"
                  )
              ),
          ]

          Path(
              "status-reports/dast-status.yaml"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write DAST job summary
        env:
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
          DAST_RESULT: ${{ needs.dast.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          TARGET_URL: ${{ needs.validate.outputs.target_url }}
        shell: bash
        run: |
          set -euo pipefail

          target_type=local-demo

          if [[ -n "$TARGET_URL" ]]; then
            target_type=external
          fi

          {
            echo "## DAST status"
            echo
            echo "- Mode: \`$DAST_MODE\`"
            echo "- Result: \`$DAST_RESULT\`"
            echo "- Target type: \`$target_type\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DAST_MODE" == "none" ]]; then
            echo "DAST was intentionally disabled"
          elif [[ "$SAST_RESULT" != "success" ]]; then
            echo "::warning::DAST did not run because SAST failed"
          elif [[ "$DAST_RESULT" == "skipped" ]]; then
            echo "::warning::DAST was unexpectedly skipped"
          fi

      - name: Upload DAST status report
        uses: actions/upload-artifact@v4
        with:
          name: dast-status-${{ needs.validate.outputs.sha }}
          path: status-reports/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Build consolidated OWASP reports
    needs:
      - validate
      - app-prep
      - sast
      - dast
      - dast-status

    if: >-
      ${{
        always() &&
        needs.validate.result == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Create consolidated report directory
        run: mkdir -p reports

      - name: Download validation reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: validation-reports-${{ needs.validate.outputs.sha }}
          path: reports/validation

      - name: Download preparation reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: preparation-reports-${{ needs.validate.outputs.sha }}
          path: reports/preparation

      - name: Download SAST reports
        if: >-
          ${{
            needs.sast.result == 'success' ||
            needs.sast.result == 'failure'
          }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sast-reports-${{ needs.validate.outputs.sha }}
          path: reports/sast

      - name: Download DAST reports
        if: >-
          ${{
            needs.dast.result == 'success' ||
            needs.dast.result == 'failure'
          }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dast-reports-${{ needs.validate.outputs.sha }}
          path: reports/dast

      - name: Download DAST status
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dast-status-${{ needs.validate.outputs.sha }}
          path: reports/status

      - name: Copy primary reports to root
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            semgrep.json \
            semgrep.yaml \
            sast-normalized.json \
            sast-normalized.yaml \
            sast-summary.md \
            sast-report.html
          do
            if [[ -s "reports/sast/$file" ]]; then
              cp "reports/sast/$file" "reports/$file"
            fi
          done

          for file in \
            zap.json \
            zap.yaml \
            zap.md \
            zap.html \
            dast-summary.yaml \
            dast-normalized.json \
            dast-normalized.yaml \
            zap-normalized.json \
            zap-normalized.yaml
          do
            if [[ -s "reports/dast/$file" ]]; then
              cp "reports/dast/$file" "reports/$file"
            fi
          done

      - name: Install YAML support
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            pyyaml

      - name: Build consolidated JSON and YAML summaries
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
          APP_TYPE: ${{ needs.app-prep.outputs.detected_app_type || needs.validate.outputs.app_type }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
          SAST_RESULT: ${{ needs.sast.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          import yaml

          root = Path("reports")
          root.mkdir(parents=True, exist_ok=True)

          def load_json(filename):
              path = root / filename

              if not path.exists():
                  return {}

              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except (OSError, json.JSONDecodeError):
                  return {}

              return data if isinstance(data, dict) else {}

          semgrep = load_json("semgrep.json")
          zap = load_json("zap.json")

          findings = semgrep.get("results", [])

          if not isinstance(findings, list):
              findings = []

          sast_counts = Counter()

          for finding in findings:
              if not isinstance(finding, dict):
                  continue

              extra = finding.get("extra", {})

              if not isinstance(extra, dict):
                  extra = {}

              severity = str(
                  extra.get("severity", "INFO")
              ).strip().upper()

              sast_counts[severity] += 1

          sites = zap.get("site", [])

          if not isinstance(sites, list):
              sites = []

          zap_counts = Counter()
          alert_count = 0

          for site in sites:
              if not isinstance(site, dict):
                  continue

              alerts = site.get("alerts", [])

              if not isinstance(alerts, list):
                  continue

              for alert in alerts:
                  if not isinstance(alert, dict):
                      continue

                  alert_count += 1

                  risk = str(
                      alert.get("riskdesc")
                      or alert.get("risk")
                      or alert.get("riskcode")
                      or ""
                  ).strip().upper()

                  if "HIGH" in risk or risk == "3":
                      zap_counts["high"] += 1
                  elif "MEDIUM" in risk or risk == "2":
                      zap_counts["medium"] += 1
                  elif "LOW" in risk or risk == "1":
                      zap_counts["low"] += 1
                  else:
                      zap_counts["informational"] += 1

          summary = {
              "assessment": {
                  "repository": os.getenv(
                      "TARGET_REPOSITORY",
                      "",
                  ),
                  "sha": os.getenv(
                      "TARGET_SHA",
                      "",
                  ),
                  "app_type": os.getenv(
                      "APP_TYPE",
                      "",
                  ),
                  "dast_mode": os.getenv(
                      "DAST_MODE",
                      "",
                  ),
                  "generated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
              },
              "jobs": {
                  "sast": os.getenv(
                      "SAST_RESULT",
                      "",
                  ),
                  "dast": os.getenv(
                      "DAST_RESULT",
                      "",
                  ),
              },
              "sast": {
                  "report_present": bool(semgrep),
                  "findings": len(findings),
                  "severity": {
                      "error": sast_counts["ERROR"],
                      "warning": sast_counts["WARNING"],
                      "info": sast_counts["INFO"],
                  },
              },
              "dast": {
                  "report_present": bool(zap),
                  "sites": len(sites),
                  "alerts": alert_count,
                  "risk": {
                      "high": zap_counts["high"],
                      "medium": zap_counts["medium"],
                      "low": zap_counts["low"],
                      "informational": (
                          zap_counts["informational"]
                      ),
                  },
              },
          }

          Path(
              "reports/owasp-pen-test-summary.json"
          ).write_text(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          Path(
              "reports/owasp-pen-test-summary.yaml"
          ).write_text(
              yaml.safe_dump(
                  summary,
                  sort_keys=False,
                  allow_unicode=True,
                  default_flow_style=False,
              ),
              encoding="utf-8",
          )

          print(
              Path(
                  "reports/owasp-pen-test-summary.yaml"
              ).read_text(encoding="utf-8")
          )
          PY

      - name: Generate report manifest YAML
        env:
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          import yaml

          root = Path("reports")

          files = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue

              files.append(
                  {
                      "path": str(
                          path.relative_to(root)
                      ),
                      "size_bytes": path.stat().st_size,
                      "format": (
                          path.suffix.lstrip(".").lower()
                          or "unknown"
                      ),
                  }
              )

          manifest = {
              "artifact": {
                  "name": (
                      "owasp-pen-test-"
                      + os.getenv("TARGET_SHA", "")
                  ),
                  "files": files,
              }
          }

          Path(
              "reports/report-manifest.yaml"
          ).write_text(
              yaml.safe_dump(
                  manifest,
                  sort_keys=False,
                  allow_unicode=True,
              ),
              encoding="utf-8",
          )
          PY

      - name: Validate consolidated reports
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/semgrep.json || {
            echo "::error::semgrep.json is missing"
            exit 1
          }

          test -s reports/semgrep.yaml || {
            echo "::error::semgrep.yaml is missing"
            exit 1
          }

          test -s reports/sast-report.html || {
            echo "::error::sast-report.html is missing"
            exit 1
          }

          test -s reports/owasp-pen-test-summary.json || {
            echo "::error::Consolidated JSON summary is missing"
            exit 1
          }

          test -s reports/owasp-pen-test-summary.yaml || {
            echo "::error::Consolidated YAML summary is missing"
            exit 1
          }

          if [[ "${{ needs.validate.outputs.dast_mode }}" != "none" ]]; then
            test -s reports/zap.json || {
              echo "::error::zap.json is missing"
              exit 1
            }

            test -s reports/zap.yaml || {
              echo "::error::zap.yaml is missing"
              exit 1
            }
          fi

      - name: Display consolidated report files
        shell: bash
        run: |
          set -euo pipefail

          find reports \
            -maxdepth 5 \
            -type f \
            -print |
            sort

      - name: Upload consolidated OWASP reports
        uses: actions/upload-artifact@v4
        with:
          name: owasp-pen-test-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Apply OWASP security policy gate
    needs:
      - validate
      - sast
      - dast
      - summary

    if: >-
      ${{
        always() &&
        needs.summary.result == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Download consolidated reports
        uses: actions/download-artifact@v4
        with:
          name: owasp-pen-test-${{ needs.validate.outputs.sha }}
          path: all-reports

      - name: Validate scanner execution
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SAST_RESULT" != "success" ]]; then
            echo "::error::SAST did not succeed: $SAST_RESULT"
            exit 1
          fi

          if [[ "$DAST_MODE" != "none" && "$DAST_RESULT" != "success" ]]; then
            echo "::error::DAST did not succeed: $DAST_RESULT"
            exit 1
          fi

      - name: Validate required policy reports
        env:
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        shell: bash
        run: |
          set -euo pipefail

          test -s all-reports/semgrep.json || {
            echo "::error::Mandatory Semgrep JSON report is missing"
            exit 1
          }

          test -s all-reports/semgrep.yaml || {
            echo "::error::Mandatory Semgrep YAML report is missing"
            exit 1
          }

          if [[ "$DAST_MODE" != "none" ]]; then
            test -s all-reports/zap.json || {
              echo "::error::Mandatory ZAP JSON report is missing"
              exit 1
            }

            test -s all-reports/zap.yaml || {
              echo "::error::Mandatory ZAP YAML report is missing"
              exit 1
            }
          fi

      - name: Display final report inventory
        shell: bash
        run: |
          set -euo pipefail

          find all-reports \
            -maxdepth 5 \
            -type f \
            -print |
            sort

          echo
          echo "Consolidated YAML summary:"
          cat all-reports/owasp-pen-test-summary.yaml

      - name: Apply OWASP policy gate
        env:
          FAIL_ON_SAST: ${{ vars.FAIL_ON_SAST || 'ERROR' }}
          FAIL_ON_ZAP_RISK: ${{ vars.FAIL_ON_ZAP_RISK || 'NONE' }}
        run: python3 scripts/security-gate.py all-reports

      - name: Create policy-gate YAML result
        if: ${{ always() }}
        env:
          FAIL_ON_SAST: ${{ vars.FAIL_ON_SAST || 'ERROR' }}
          FAIL_ON_ZAP_RISK: ${{ vars.FAIL_ON_ZAP_RISK || 'NONE' }}
          GATE_OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          def quote(value):
              text = str(value or "")
              return (
                  '"'
                  + text.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  + '"'
              )

          lines = [
              "policy_gate:",
              (
                  "  sast_threshold: "
                  + quote(os.getenv("FAIL_ON_SAST"))
              ),
              (
                  "  zap_threshold: "
                  + quote(os.getenv("FAIL_ON_ZAP_RISK"))
              ),
              (
                  "  status: "
                  + quote(os.getenv("GATE_OUTCOME"))
              ),
          ]

          Path(
              "all-reports/policy-gate-result.yaml"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload policy-gate result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-${{ needs.validate.outputs.sha }}
          path: all-reports/policy-gate-result.yaml
          if-no-files-found: warn
          retention-days: 30