name: OWASP Penetration Testing

run-name: >-
  OWASP Pen Test ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}@${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      target_repository:
        description: owner/repository to test
        required: true
        type: string

      target_sha:
        description: Exact commit SHA to assess
        required: true
        type: string

      app_type:
        description: Application type
        required: false
        default: auto
        type: choice
        options:
          - auto
          - web
          - api
          - cloud-native
          - desktop
          - library

      target_url:
        description: Optional authorized non-production URL; empty uses local Juice Shop
        required: false
        type: string

      openapi_url:
        description: OpenAPI URL for API mode
        required: false
        type: string

      dast_mode:
        description: DAST mode
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - full
          - api
          - none

  repository_dispatch:
    types:
      - owasp-pen-test

  workflow_call:
    inputs:
      target_repository:
        description: owner/repository to test
        required: true
        type: string

      target_sha:
        description: Exact commit SHA to assess
        required: true
        type: string

      app_type:
        description: Application type
        required: false
        default: auto
        type: string

      target_url:
        description: Optional authorized non-production URL
        required: false
        default: ""
        type: string

      openapi_url:
        description: OpenAPI URL for API mode
        required: false
        default: ""
        type: string

      dast_mode:
        description: DAST mode
        required: false
        default: baseline
        type: string

    secrets:
      SECURITY_REPO_TOKEN:
        description: Token for cloning an authorized private repository
        required: false

concurrency:
  group: >-
    owasp-${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}-${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEFAULT_APP_TYPE: ${{ vars.DEFAULT_APP_TYPE || 'auto' }}
  DEFAULT_DAST_MODE: ${{ vars.DEFAULT_DAST_MODE || 'baseline' }}

jobs:
  validate:
    name: Validate and normalize inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      repository: ${{ steps.inputs.outputs.repository }}
      sha: ${{ steps.inputs.outputs.sha }}
      app_type: ${{ steps.inputs.outputs.app_type }}
      target_url: ${{ steps.inputs.outputs.target_url }}
      openapi_url: ${{ steps.inputs.outputs.openapi_url }}
      dast_mode: ${{ steps.inputs.outputs.dast_mode }}

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Normalize and validate inputs
        id: inputs
        env:
          TARGET_REPOSITORY: >-
            ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}
          TARGET_SHA: >-
            ${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}
          APP_TYPE: >-
            ${{ inputs.app_type || github.event.client_payload.app_type || vars.DEFAULT_APP_TYPE || 'auto' }}
          TARGET_URL: >-
            ${{ inputs.target_url || github.event.client_payload.target_url || vars.DAST_TARGET_URL }}
          OPENAPI_URL: >-
            ${{ inputs.openapi_url || github.event.client_payload.openapi_url || vars.DAST_OPENAPI_URL }}
          DAST_MODE: >-
            ${{ inputs.dast_mode || github.event.client_payload.dast_mode || vars.DEFAULT_DAST_MODE || 'baseline' }}

        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid target repository: $TARGET_REPOSITORY"
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Target SHA must be an exact 40-character commit SHA"
            exit 1
          fi

          case "$APP_TYPE" in
            auto|web|api|cloud-native|desktop|library)
              ;;
            *)
              echo "::error::Unsupported application type: $APP_TYPE"
              exit 1
              ;;
          esac

          case "$DAST_MODE" in
            baseline|full|api|none)
              ;;
            *)
              echo "::error::Unsupported DAST mode: $DAST_MODE"
              exit 1
              ;;
          esac

          if [[ "$DAST_MODE" == "api" && -z "$OPENAPI_URL" ]]; then
            echo "::error::openapi_url is required when dast_mode=api"
            exit 1
          fi

          echo "repository=$TARGET_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "app_type=$APP_TYPE" >> "$GITHUB_OUTPUT"
          echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
          echo "openapi_url=$OPENAPI_URL" >> "$GITHUB_OUTPUT"
          echo "dast_mode=$DAST_MODE" >> "$GITHUB_OUTPUT"

          if [[ -n "$TARGET_URL" ]]; then
            echo "External DAST target configured: yes"
          else
            echo "External DAST target configured: no"
            echo "The workflow will use an isolated local OWASP Juice Shop target"
          fi

          echo "Repository: $TARGET_REPOSITORY"
          echo "SHA: $TARGET_SHA"
          echo "Application type: $APP_TYPE"
          echo "DAST mode: $DAST_MODE"

  app-prep:
    name: Prepare application
    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Clone exact target commit
        env:
          GH_TOKEN: ${{ secrets.SECURITY_REPO_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf target
          git init target

          git -C target remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPOSITORY}.git"

          git -C target fetch \
            --depth 1 \
            origin \
            "$TARGET_SHA"

          git -C target checkout \
            --detach \
            FETCH_HEAD

          actual_sha="$(git -C target rev-parse HEAD)"

          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Cloned SHA $actual_sha does not match $TARGET_SHA"
            exit 1
          fi

          echo "Target repository cloned successfully"
          echo "Commit: $actual_sha"

      - name: Detect application type
        env:
          REQUESTED_APP_TYPE: ${{ needs.validate.outputs.app_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -x scripts/detect-app.sh ]]; then
            bash scripts/detect-app.sh target | tee detection.env
          else
            echo "APP_TYPE=$REQUESTED_APP_TYPE" | tee detection.env
          fi

      - name: Upload prepared target
        uses: actions/upload-artifact@v4
        with:
          name: prepared-target-${{ needs.validate.outputs.sha }}
          path: |
            target/
            detection.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sast:
    name: Static application security testing
    needs:
      - validate
      - app-prep

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Download prepared target
        uses: actions/download-artifact@v4
        with:
          name: prepared-target-${{ needs.validate.outputs.sha }}
          path: .

      - name: Validate prepared target
        shell: bash
        run: |
          set -euo pipefail

          test -d target || {
            echo "::error::Prepared target directory is missing"
            exit 1
          }

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            --disable-pip-version-check \
            semgrep

          semgrep --version

      - name: Run Semgrep CE
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          set +e

          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            target

          semgrep_exit_code=$?

          set -e

          echo "Semgrep exit code: $semgrep_exit_code"

          test -s reports/semgrep.json || {
            echo "::error::Semgrep did not produce reports/semgrep.json"
            exit 1
          }

      - name: Validate Semgrep JSON report
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("reports/semgrep.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(report, dict):
              raise SystemExit("Semgrep report must contain a JSON object")

          findings = report.get("results", [])

          if not isinstance(findings, list):
              raise SystemExit("Semgrep results must be an array")

          counts = Counter()

          for finding in findings:
              if not isinstance(finding, dict):
                  continue

              extra = finding.get("extra", {})

              if not isinstance(extra, dict):
                  extra = {}

              severity = str(
                  extra.get("severity", "INFO")
              ).strip().upper()

              counts[severity] += 1

          print(f"Total findings: {len(findings)}")
          print(f"ERROR: {counts.get('ERROR', 0)}")
          print(f"WARNING: {counts.get('WARNING', 0)}")
          print(f"INFO: {counts.get('INFO', 0)}")
          PY

      - name: Map findings to OWASP standards
        if: ${{ hashFiles('reports/semgrep.json') != '' }}
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          if [[ -f scripts/map-findings.py ]]; then
            python3 scripts/map-findings.py \
              reports/semgrep.json \
              reports
          else
            echo "::warning::scripts/map-findings.py not found; mapping skipped"
          fi

      - name: Upload SAST reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  dast:
    name: Dynamic application security testing
    needs:
      - validate
      - app-prep
      - sast

    if: ${{ needs.validate.outputs.dast_mode != 'none' }}

    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXTERNAL_TARGET_URL: ${{ needs.validate.outputs.target_url }}
      OPENAPI_URL: ${{ needs.validate.outputs.openapi_url }}
      DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
      LOCAL_TARGET_URL: http://127.0.0.1:3000
      JUICE_SHOP_IMAGE: bkimminich/juice-shop:latest
      JUICE_SHOP_CONTAINER: owasp-dast-target

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Select DAST target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$EXTERNAL_TARGET_URL" ]]; then
            echo "type=external" >> "$GITHUB_OUTPUT"
            echo "url=$EXTERNAL_TARGET_URL" >> "$GITHUB_OUTPUT"
            echo "Using authorized external DAST target"
          else
            echo "type=local-demo" >> "$GITHUB_OUTPUT"
            echo "url=$LOCAL_TARGET_URL" >> "$GITHUB_OUTPUT"
            echo "Using isolated local OWASP Juice Shop target"
          fi

      - name: Validate external target
        if: ${{ steps.target.outputs.type == 'external' }}
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          ALLOWED_TARGET_SUFFIXES: ${{ vars.ALLOWED_TARGET_SUFFIXES }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -x scripts/validate-target.sh ]]; then
            bash scripts/validate-target.sh
          else
            echo "::error::scripts/validate-target.sh is required for external targets"
            exit 1
          fi

      - name: Start isolated OWASP Juice Shop
        if: ${{ steps.target.outputs.type == 'local-demo' }}
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$JUICE_SHOP_IMAGE"

          docker run \
            --detach \
            --name "$JUICE_SHOP_CONTAINER" \
            --publish 127.0.0.1:3000:3000 \
            --memory 1g \
            --cpus 2 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "$JUICE_SHOP_IMAGE"

          docker ps \
            --filter "name=$JUICE_SHOP_CONTAINER"

      - name: Wait for DAST target
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$TARGET_URL" || true
            )"

            echo "Attempt $attempt: HTTP ${status:-unreachable}"

            if [[ "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "DAST target is reachable"
              exit 0
            fi

            sleep 5
          done

          echo "::error::DAST target did not become ready"

          if docker container inspect \
            "$JUICE_SHOP_CONTAINER" >/dev/null 2>&1
          then
            docker logs "$JUICE_SHOP_CONTAINER" || true
          fi

          exit 1

      - name: Display DAST configuration
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          TARGET_TYPE: ${{ steps.target.outputs.type }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Target type: $TARGET_TYPE"
          echo "Target URL: $TARGET_URL"
          echo "DAST mode: $DAST_MODE"

          if [[ "$DAST_MODE" == "api" && -z "$OPENAPI_URL" ]]; then
            echo "::error::OPENAPI_URL is required when DAST_MODE=api"
            exit 1
          fi

      - name: Run OWASP ZAP
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports
          bash scripts/run-zap.sh reports

      - name: Validate ZAP report
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/zap.json || {
            echo "::error::OWASP ZAP did not produce reports/zap.json"
            find reports -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/zap.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(report, dict):
              raise SystemExit("ZAP report must contain a JSON object")

          sites = report.get("site", [])

          if not isinstance(sites, list):
              raise SystemExit("ZAP site property must be an array")

          alert_count = 0

          for site in sites:
              if not isinstance(site, dict):
                  continue

              alerts = site.get("alerts", [])

              if isinstance(alerts, list):
                  alert_count += len(alerts)

          print(f"Sites: {len(sites)}")
          print(f"Alerts: {alert_count}")
          PY

      - name: Map ZAP findings to WSTG and ASVS
        if: ${{ hashFiles('reports/zap.json') != '' }}
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f scripts/map-zap.py ]]; then
            python3 scripts/map-zap.py \
              reports/zap.json \
              reports
          else
            echo "::warning::scripts/map-zap.py not found; mapping skipped"
          fi

      - name: Capture local target logs
        if: >-
          ${{
            always() &&
            steps.target.outputs.type == 'local-demo'
          }}
        shell: bash
        run: |
          set +e

          mkdir -p reports

          docker logs "$JUICE_SHOP_CONTAINER" \
            > reports/juice-shop.log \
            2>&1

          docker inspect "$JUICE_SHOP_CONTAINER" \
            > reports/juice-shop-inspect.json \
            2>/dev/null

          exit 0

      - name: Stop isolated OWASP Juice Shop
        if: >-
          ${{
            always() &&
            steps.target.outputs.type == 'local-demo'
          }}
        shell: bash
        run: |
          set +e

          docker rm \
            --force \
            "$JUICE_SHOP_CONTAINER"

          exit 0

      - name: Upload DAST reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  dast-status:
    name: Explain DAST status
    needs:
      - validate
      - app-prep
      - sast
      - dast

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report DAST execution status
        env:
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
          DAST_RESULT: ${{ needs.dast.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          TARGET_URL: ${{ needs.validate.outputs.target_url }}
        shell: bash
        run: |
          set -euo pipefail

          target_type=local-demo

          if [[ -n "$TARGET_URL" ]]; then
            target_type=external
          fi

          echo "DAST mode: $DAST_MODE"
          echo "DAST result: $DAST_RESULT"
          echo "DAST target type: $target_type"

          {
            echo "## DAST status"
            echo
            echo "- Mode: \`$DAST_MODE\`"
            echo "- Result: \`$DAST_RESULT\`"
            echo "- Target type: \`$target_type\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DAST_MODE" == "none" ]]; then
            echo "DAST was intentionally disabled"
          elif [[ "$SAST_RESULT" != "success" ]]; then
            echo "::warning::DAST did not run because SAST did not succeed"
          elif [[ "$DAST_RESULT" == "skipped" ]]; then
            echo "::warning::DAST was unexpectedly skipped"
          else
            echo "DAST completed with result: $DAST_RESULT"
          fi

  summary:
    name: Build OWASP penetration-test summary
    needs:
      - validate
      - sast
      - dast
      - dast-status

    if: >-
      ${{
        always() &&
        needs.validate.result == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p reports

      - name: Download SAST reports
        if: >-
          ${{
            needs.sast.result == 'success' ||
            needs.sast.result == 'failure'
          }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sast-reports-${{ needs.validate.outputs.sha }}
          path: reports

      - name: Download DAST reports
        if: >-
          ${{
            needs.dast.result == 'success' ||
            needs.dast.result == 'failure'
          }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dast-reports-${{ needs.validate.outputs.sha }}
          path: reports

      - name: Build YAML summary
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
          APP_TYPE: ${{ needs.validate.outputs.app_type }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
          SAST_RESULT: ${{ needs.sast.result }}
          DAST_RESULT: ${{ needs.dast.result }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          root = Path("reports")
          root.mkdir(parents=True, exist_ok=True)

          def load_json(filename):
              path = root / filename

              if not path.exists():
                  return {}

              try:
                  value = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except (OSError, json.JSONDecodeError):
                  return {}

              return value if isinstance(value, dict) else {}

          def quote(value):
              text = str(value or "")

              return (
                  '"'
                  + text.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\r", "\\r")
                  .replace("\n", "\\n")
                  + '"'
              )

          semgrep = load_json("semgrep.json")
          zap = load_json("zap.json")

          findings = semgrep.get("results", [])

          if not isinstance(findings, list):
              findings = []

          sast_counts = Counter()

          for finding in findings:
              if not isinstance(finding, dict):
                  continue

              extra = finding.get("extra", {})

              if not isinstance(extra, dict):
                  extra = {}

              severity = str(
                  extra.get("severity", "INFO")
              ).strip().upper()

              sast_counts[severity] += 1

          sites = zap.get("site", [])

          if not isinstance(sites, list):
              sites = []

          zap_counts = Counter()

          for site in sites:
              if not isinstance(site, dict):
                  continue

              alerts = site.get("alerts", [])

              if not isinstance(alerts, list):
                  continue

              for alert in alerts:
                  if not isinstance(alert, dict):
                      continue

                  risk = str(
                      alert.get("riskdesc")
                      or alert.get("risk")
                      or alert.get("riskcode")
                      or ""
                  ).strip().upper()

                  if "HIGH" in risk or risk == "3":
                      zap_counts["HIGH"] += 1
                  elif "MEDIUM" in risk or risk == "2":
                      zap_counts["MEDIUM"] += 1
                  elif "LOW" in risk or risk == "1":
                      zap_counts["LOW"] += 1
                  else:
                      zap_counts["INFORMATIONAL"] += 1

          lines = [
              "assessment:",
              (
                  "  repository: "
                  + quote(os.getenv("TARGET_REPOSITORY"))
              ),
              (
                  "  sha: "
                  + quote(os.getenv("TARGET_SHA"))
              ),
              (
                  "  app_type: "
                  + quote(os.getenv("APP_TYPE"))
              ),
              (
                  "  dast_mode: "
                  + quote(os.getenv("DAST_MODE"))
              ),
              "jobs:",
              (
                  "  sast: "
                  + quote(os.getenv("SAST_RESULT"))
              ),
              (
                  "  dast: "
                  + quote(os.getenv("DAST_RESULT"))
              ),
              "sast:",
              (
                  "  report_present: "
                  + str(
                      (root / "semgrep.json").exists()
                  ).lower()
              ),
              f"  findings: {len(findings)}",
              f"  error: {sast_counts.get('ERROR', 0)}",
              f"  warning: {sast_counts.get('WARNING', 0)}",
              f"  info: {sast_counts.get('INFO', 0)}",
              "dast:",
              (
                  "  report_present: "
                  + str(
                      (root / "zap.json").exists()
                  ).lower()
              ),
              f"  sites: {len(sites)}",
              f"  high: {zap_counts.get('HIGH', 0)}",
              f"  medium: {zap_counts.get('MEDIUM', 0)}",
              f"  low: {zap_counts.get('LOW', 0)}",
              (
                  "  informational: "
                  + str(
                      zap_counts.get("INFORMATIONAL", 0)
                  )
              ),
          ]

          output = root / "owasp-pen-test-summary.yaml"

          output.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload consolidated reports
        uses: actions/upload-artifact@v4
        with:
          name: owasp-pen-test-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: Apply OWASP security policy gate
    needs:
      - validate
      - sast
      - dast
      - summary

    if: >-
      ${{
        always() &&
        needs.summary.result == 'success'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout security workflow repository
        uses: actions/checkout@v4

      - name: Download consolidated reports
        uses: actions/download-artifact@v4
        with:
          name: owasp-pen-test-${{ needs.validate.outputs.sha }}
          path: all-reports

      - name: Display reports
        shell: bash
        run: |
          set -euo pipefail

          find all-reports \
            -maxdepth 4 \
            -type f \
            -print |
            sort

          echo
          echo "OWASP summary:"
          cat all-reports/owasp-pen-test-summary.yaml

      - name: Require successful scanners
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SAST_RESULT" != "success" ]]; then
            echo "::error::SAST did not succeed: $SAST_RESULT"
            exit 1
          fi

          if [[ "$DAST_MODE" != "none" && "$DAST_RESULT" != "success" ]]; then
            echo "::error::DAST did not succeed: $DAST_RESULT"
            exit 1
          fi

      - name: Apply OWASP policy gate
        env:
          FAIL_ON_SAST: ${{ vars.FAIL_ON_SAST || 'ERROR' }}
          FAIL_ON_ZAP_RISK: ${{ vars.FAIL_ON_ZAP_RISK || 'NONE' }}
        run: python3 scripts/security-gate.py all-reports