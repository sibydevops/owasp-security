name: Central OWASP Security Scan
run-name: Security scan ${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}@${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: owner/repository
        required: true
        type: string
      target_sha:
        description: Exact commit SHA
        required: true
        type: string
      app_type:
        description: auto, web, api, cloud-native, desktop, library
        required: false
        default: auto
        type: choice
        options: [auto, web, api, cloud-native, desktop, library]
      target_url:
        description: Authorized non-production URL for ZAP; leave empty when DAST is not applicable
        required: false
        type: string
      openapi_url:
        description: OpenAPI document URL for API scan
        required: false
        type: string
      dast_mode:
        description: baseline, full, api, or none
        required: false
        default: baseline
        type: choice
        options: [baseline, full, api, none]
  repository_dispatch:
    types: [owasp-security-scan]

concurrency:
  group: security-${{ inputs.target_repository || github.event.client_payload.target_repository || github.repository }}-${{ inputs.target_sha || github.event.client_payload.target_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, linux, security]
    outputs:
      repository: ${{ steps.input.outputs.repository }}
      sha: ${{ steps.input.outputs.sha }}
      app_type: ${{ steps.input.outputs.app_type }}
      target_url: ${{ steps.input.outputs.target_url }}
      openapi_url: ${{ steps.input.outputs.openapi_url }}
      dast_mode: ${{ steps.input.outputs.dast_mode }}
    steps:
      - uses: actions/checkout@v4
      - id: input
        env:
          WD_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          WD_SHA: ${{ inputs.target_sha || github.sha }}
          WD_APP_TYPE: ${{ inputs.app_type }}
          WD_TARGET_URL: ${{ inputs.target_url }}
          WD_OPENAPI_URL: ${{ inputs.openapi_url }}
          WD_DAST_MODE: ${{ inputs.dast_mode }}
          RD_REPOSITORY: ${{ github.event.client_payload.target_repository || github.repository }}
          RD_SHA: ${{ github.event.client_payload.target_sha || github.sha }}
          RD_APP_TYPE: ${{ github.event.client_payload.app_type }}
          RD_TARGET_URL: ${{ github.event.client_payload.target_url }}
          RD_OPENAPI_URL: ${{ github.event.client_payload.openapi_url }}
          RD_DAST_MODE: ${{ github.event.client_payload.dast_mode }}
        run: bash ./scripts/normalize-inputs.sh

  sast:
    needs: validate
    runs-on: [self-hosted, linux, security]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact target commit
        env:
          GH_TOKEN: ${{ secrets.SECURITY_REPO_TOKEN }}
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: bash ./scripts/clone-target.sh
      - name: Detect application type
        id: detect
        env:
          REQUESTED_APP_TYPE: ${{ needs.validate.outputs.app_type }}
        run: bash ./scripts/detect-app.sh target | tee detection.env
      - name: Run Semgrep CE
        run: bash ./scripts/run-semgrep.sh target reports
      - name: Create OWASP mapping and summary
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/map-findings.py reports/semgrep.json reports
      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  dast:
    needs: [validate, sast]
    if: ${{ needs.validate.outputs.dast_mode != 'none' && needs.validate.outputs.target_url != '' }}
    runs-on: [self-hosted, linux, security]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate authorization and target safety
        env:
          TARGET_URL: ${{ needs.validate.outputs.target_url }}
          ALLOWED_TARGET_SUFFIXES: ${{ vars.ALLOWED_TARGET_SUFFIXES }}
        run: bash ./scripts/validate-target.sh
      - name: Run OWASP ZAP
        env:
          TARGET_URL: ${{ needs.validate.outputs.target_url }}
          OPENAPI_URL: ${{ needs.validate.outputs.openapi_url }}
          DAST_MODE: ${{ needs.validate.outputs.dast_mode }}
        run: bash ./scripts/run-zap.sh reports
      - name: Map ZAP findings to OWASP WSTG and ASVS
        env:
          TARGET_REPOSITORY: ${{ needs.validate.outputs.repository }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 scripts/map-zap.py reports/zap.json reports
      - name: Upload DAST reports
        uses: actions/upload-artifact@v4
        with:
          name: dast-${{ needs.validate.outputs.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  dast-not-applicable:
    needs: [validate, sast]
    if: ${{ needs.validate.outputs.dast_mode == 'none' || needs.validate.outputs.target_url == '' }}
    runs-on: [self-hosted, linux, security]
    steps:
      - run: |
          echo '## DAST not executed' >> "$GITHUB_STEP_SUMMARY"
          echo 'A reachable, explicitly authorized target URL is required for OWASP ZAP.' >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: [validate, sast, dast, dast-not-applicable]
    if: ${{ always() && needs.sast.result == 'success' }}
    runs-on: [self-hosted, linux, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ needs.validate.outputs.sha }}'
          path: all-reports
          merge-multiple: true
      - name: Apply policy
        env:
          FAIL_ON_SAST: ${{ vars.FAIL_ON_SAST || 'ERROR' }}
          FAIL_ON_ZAP_RISK: ${{ vars.FAIL_ON_ZAP_RISK || 'High' }}
        run: python3 scripts/security-gate.py all-reports
