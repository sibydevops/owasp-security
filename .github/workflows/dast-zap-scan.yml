name: Reusable OWASP ZAP Web Scan

on:
  workflow_call:
    inputs:
      target_url:
        description: Authorized target URL
        required: false
        default: ""
        type: string

      mode:
        description: baseline or full
        required: false
        default: baseline
        type: string

      fail_on_zap_risk:
        description: NONE, INFORMATIONAL, LOW, MEDIUM, or HIGH
        required: false
        default: NONE
        type: string

    outputs:
      scan_status:
        description: Web DAST execution status
        value: ${{ jobs.dast_web.outputs.scan_status }}

  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized URL; empty uses local Juice Shop
        required: false
        type: string

      mode:
        description: ZAP scan mode
        required: false
        default: baseline
        type: choice
        options:
          - baseline
          - full

      fail_on_zap_risk:
        description: ZAP risk threshold
        required: false
        default: NONE
        type: choice
        options:
          - NONE
          - INFORMATIONAL
          - LOW
          - MEDIUM
          - HIGH

permissions:
  contents: read

jobs:
  dast_web:
    name: OWASP ZAP Web DAST
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      scan_status: ${{ steps.status.outputs.scan_status }}

    env:
      EXTERNAL_TARGET_URL: ${{ inputs.target_url }}
      DAST_MODE: ${{ inputs.mode || 'baseline' }}
      LOCAL_TARGET_URL: http://127.0.0.1:3000
      JUICE_SHOP_CONTAINER: owasp-zap-web-target
      JUICE_SHOP_IMAGE: bkimminich/juice-shop:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate DAST implementation
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/run-zap.sh || {
            echo "::error::scripts/run-zap.sh is missing"
            exit 1
          }

          test -f \
            .github/actions/security-report/action.yml || {
            echo "::error::Security report action is missing"
            exit 1
          }

          case "$DAST_MODE" in
            baseline|full)
              ;;
            *)
              echo "::error::Unsupported DAST mode: $DAST_MODE"
              exit 1
              ;;
          esac

      - name: Select DAST target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$EXTERNAL_TARGET_URL" ]]; then
            echo "type=external" >> "$GITHUB_OUTPUT"
            echo "url=$EXTERNAL_TARGET_URL" >> "$GITHUB_OUTPUT"
          else
            echo "type=local" >> "$GITHUB_OUTPUT"
            echo "url=$LOCAL_TARGET_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate external target
        if: ${{ steps.target.outputs.type == 'external' }}
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          ALLOWED_TARGET_SUFFIXES: ${{ vars.ALLOWED_TARGET_SUFFIXES }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TARGET_URL" != https://* ]]; then
            echo "::error::External targets must use HTTPS"
            exit 1
          fi

          if [[ -z "$ALLOWED_TARGET_SUFFIXES" ]]; then
            echo "::error::ALLOWED_TARGET_SUFFIXES is required"
            exit 1
          fi

          host="$(
            python3 - "$TARGET_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          parsed = urlparse(sys.argv[1])

          if not parsed.hostname:
              raise SystemExit(
                  "Target URL has no hostname"
              )

          print(parsed.hostname.lower())
          PY
          )"

          allowed=false

          IFS=',' read -ra suffixes \
            <<< "$ALLOWED_TARGET_SUFFIXES"

          for suffix in "${suffixes[@]}"; do
            suffix="$(
              printf '%s' "$suffix" |
              xargs |
              tr '[:upper:]' '[:lower:]'
            )"

            [[ -n "$suffix" ]] || continue

            if [[ "$host" == "$suffix" ]] ||
               [[ "$host" == *".$suffix" ]]
            then
              allowed=true
              break
            fi
          done

          if [[ "$allowed" != "true" ]]; then
            echo "::error::External target is not authorized"
            exit 1
          fi

      - name: Start local OWASP Juice Shop
        if: ${{ steps.target.outputs.type == 'local' }}
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$JUICE_SHOP_IMAGE"

          docker run \
            --detach \
            --name "$JUICE_SHOP_CONTAINER" \
            --publish 127.0.0.1:3000:3000 \
            --memory 1g \
            --cpus 2 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "$JUICE_SHOP_IMAGE"

      - name: Wait for DAST target
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$TARGET_URL" || true
            )"

            echo "Attempt $attempt: HTTP ${status:-unreachable}"

            if [[ "$status" =~ ^[1-5][0-9][0-9]$ ]]; then
              exit 0
            fi

            sleep 5
          done

          echo "::error::DAST target did not become ready"
          exit 1

      - name: Prepare ZAP rules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/dast-web

          if [[ -s .zap/rules.tsv ]]; then
            cp \
              .zap/rules.tsv \
              reports/dast-web/rules.tsv
          fi

      - name: Run OWASP ZAP web scan
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          ZAP_RULES_FILE: rules.tsv
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/run-zap.sh \
            reports/dast-web

      - name: Restore report ownership
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          sudo chown \
            --recursive \
            "$(id -u):$(id -g)" \
            reports \
            2>/dev/null || true

          chmod \
            --recursive \
            u+rwX \
            reports \
            2>/dev/null || true

          exit 0

      - name: Generate web DAST reports
        uses: ./.github/actions/security-report
        with:
          tool: zap
          input-file: reports/dast-web/zap.json
          output-directory: reports/dast-web
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          scan-mode: ${{ env.DAST_MODE }}

      - name: Create normalized web DAST status
        id: status
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/dast-web/zap-status.json || {
            echo "::error::zap-status.json is missing"
            exit 1
          }

          test -s reports/dast-web/zap-status.yaml || {
            echo "::error::zap-status.yaml is missing"
            exit 1
          }

          cp \
            reports/dast-web/zap-status.json \
            reports/dast-web/dast-web-status.json

          cp \
            reports/dast-web/zap-status.yaml \
            reports/dast-web/dast-web-status.yaml

          echo "scan_status=completed" \
            >> "$GITHUB_OUTPUT"
            
      - name: Capture local target logs
        if: >-
          ${{
            always() &&
            steps.target.outputs.type == 'local'
          }}
        shell: bash
        run: |
          set +e

          docker logs "$JUICE_SHOP_CONTAINER" \
            > reports/dast-web/juice-shop.log \
            2>&1

          docker inspect "$JUICE_SHOP_CONTAINER" \
            > reports/dast-web/juice-shop-inspect.json \
            2>/dev/null

          exit 0

      - name: Stop local target
        if: >-
          ${{
            always() &&
            steps.target.outputs.type == 'local'
          }}
        shell: bash
        run: |
          docker rm \
            --force \
            "$JUICE_SHOP_CONTAINER" || true

      - name: Upload web DAST reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dast-web-reports-${{ github.sha }}
          path: reports/dast-web/
          if-no-files-found: warn
          retention-days: 30