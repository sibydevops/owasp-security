name: Code Coverage Evidence

description: >-
  Runs an optional test command, extracts code coverage, and
  generates JSON, YAML, and HTML control evidence.

inputs:
  test-command:
    description: Command that runs tests and generates coverage.
    required: false
    default: ""

  report-path:
    description: Path to the generated coverage report.
    required: false
    default: ""

  minimum-coverage:
    description: Minimum required coverage percentage.
    required: false
    default: "0"

  output-directory:
    description: Directory for coverage evidence.
    required: false
    default: reports/coverage

outputs:
  status:
    description: Coverage control status.
    value: ${{ steps.coverage.outputs.status }}

  percentage:
    description: Detected coverage percentage.
    value: ${{ steps.coverage.outputs.percentage }}

runs:
  using: composite

  steps:
    - name: Run coverage command
      if: ${{ inputs.test-command != '' }}
      shell: bash
      env:
        TEST_COMMAND: ${{ inputs.test-command }}
      run: |
        set -euo pipefail

        echo "Running configured test and coverage command"

        bash \
          -o pipefail \
          -c "$TEST_COMMAND"

    - name: Generate coverage evidence
      id: coverage
      shell: bash
      env:
        COVERAGE_REPORT_PATH: ${{ inputs.report-path }}
        MINIMUM_COVERAGE: ${{ inputs.minimum-coverage }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail

        mkdir -p "$OUTPUT_DIRECTORY"

        python3 - <<'PY'
        import html
        import json
        import os
        import re
        from datetime import datetime, timezone
        from pathlib import Path


        def parse_percentage(content):
            """Extract coverage from common report formats."""

            patterns = [
                (
                    r'line-rate="([0-9.]+)"',
                    True,
                ),
                (
                    r'"line-rate"\s*:\s*([0-9.]+)',
                    True,
                ),
                (
                    r'"coverage"\s*:\s*([0-9.]+)',
                    False,
                ),
                (
                    r"TOTAL\s+\d+\s+\d+\s+([0-9.]+)%",
                    False,
                ),
                (
                    r"Lines\s*:\s*([0-9.]+)%",
                    False,
                ),
            ]

            for pattern, fractional in patterns:
                match = re.search(
                    pattern,
                    content,
                    re.IGNORECASE,
                )

                if match is None:
                    continue

                value = float(
                    match.group(1)
                )

                if fractional and value <= 1:
                    value *= 100

                return round(
                    value,
                    2,
                )

            return None


        def yaml_quote(value):
            """Quote a value for simple YAML output."""

            text = str(
                value or ""
            )

            return (
                '"'
                + text
                .replace(
                    "\\",
                    "\\\\",
                )
                .replace(
                    '"',
                    '\\"',
                )
                .replace(
                    "\r",
                    "\\r",
                )
                .replace(
                    "\n",
                    "\\n",
                )
                + '"'
            )


        report_value = os.getenv(
            "COVERAGE_REPORT_PATH",
            "",
        ).strip()

        minimum_value = os.getenv(
            "MINIMUM_COVERAGE",
            "0",
        ).strip()

        output_directory = Path(
            os.getenv(
                "OUTPUT_DIRECTORY",
                "reports/coverage",
            )
        )

        try:
            minimum = float(
                minimum_value
            )
        except ValueError as exc:
            raise SystemExit(
                "Invalid minimum coverage: "
                f"{minimum_value}"
            ) from exc

        if minimum < 0 or minimum > 100:
            raise SystemExit(
                "Minimum coverage must be between 0 and 100"
            )

        percentage = 0.0
        status = "not_applicable"
        reason = (
            "No coverage report was configured "
            "for this repository"
        )

        if report_value:
            report_path = Path(
                report_value
            )

            if not report_path.is_file():
                raise SystemExit(
                    "Configured coverage report is missing: "
                    f"{report_path}"
                )

            content = report_path.read_text(
                encoding="utf-8",
                errors="replace",
            )

            detected = parse_percentage(
                content
            )

            if detected is None:
                raise SystemExit(
                    "Unable to extract coverage percentage "
                    f"from {report_path}"
                )

            percentage = detected

            if percentage >= minimum:
                status = "completed"
                reason = ""
            else:
                status = "failed"
                reason = (
                    f"Coverage {percentage}% is below "
                    f"minimum {minimum}%"
                )

        recorded_at = datetime.now(
            timezone.utc
        ).isoformat()

        document = {
            "control": {
                "id": "CODE_COVERAGE",
                "status": status,
                "reason": reason,
                "tool": "repository-test-suite",
                "repository": os.getenv(
                    "GITHUB_REPOSITORY",
                    "",
                ),
                "sha": os.getenv(
                    "GITHUB_SHA",
                    "",
                ),
                "percentage": percentage,
                "minimum_percentage": minimum,
                "report_path": report_value,
                "recorded_at": recorded_at,
            }
        }

        output_directory.mkdir(
            parents=True,
            exist_ok=True,
        )

        json_output = (
            output_directory
            / "coverage-status.json"
        )

        yaml_output = (
            output_directory
            / "coverage-status.yaml"
        )

        html_output = (
            output_directory
            / "coverage-report.html"
        )

        json_output.write_text(
            json.dumps(
                document,
                indent=2,
                ensure_ascii=False,
            )
            + "\n",
            encoding="utf-8",
        )

        yaml_lines = [
            "control:",
            '  id: "CODE_COVERAGE"',
            (
                "  status: "
                + yaml_quote(status)
            ),
            (
                "  reason: "
                + yaml_quote(reason)
            ),
            '  tool: "repository-test-suite"',
            (
                "  repository: "
                + yaml_quote(
                    os.getenv(
                        "GITHUB_REPOSITORY",
                        "",
                    )
                )
            ),
            (
                "  sha: "
                + yaml_quote(
                    os.getenv(
                        "GITHUB_SHA",
                        "",
                    )
                )
            ),
            f"  percentage: {percentage}",
            (
                "  minimum_percentage: "
                f"{minimum}"
            ),
            (
                "  report_path: "
                + yaml_quote(
                    report_value
                )
            ),
            (
                "  recorded_at: "
                + yaml_quote(
                    recorded_at
                )
            ),
        ]

        yaml_output.write_text(
            "\n".join(
                yaml_lines
            )
            + "\n",
            encoding="utf-8",
        )

        status_color = {
            "completed": "#107c10",
            "failed": "#d13438",
            "not_applicable": "#605e5c",
        }.get(
            status,
            "#605e5c",
        )

        html_document = f"""<!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
          >

          <title>Code Coverage Evidence</title>

          <style>
            body {{
              margin: 32px;
              color: #1f2937;
              font-family:
                "Segoe UI",
                Arial,
                sans-serif;
            }}

            main {{
              max-width: 800px;
              padding: 24px;
              border: 1px solid #d1d5db;
              border-radius: 8px;
            }}

            h1 {{
              color: #0067b8;
            }}

            .metric {{
              margin: 24px 0;
              color: {status_color};
              font-size: 42px;
              font-weight: 700;
            }}
          </style>
        </head>

        <body>
          <main>
            <h1>Code Coverage Evidence</h1>

            <div class="metric">
              {percentage}%
            </div>

            <p>
              Status:
              {html.escape(status)}
            </p>

            <p>
              Minimum:
              {minimum}%
            </p>

            <p>
              Reason:
              {html.escape(
                  reason
                  or "Coverage requirement satisfied"
              )}
            </p>
          </main>
        </body>
        </html>
        """

        html_output.write_text(
            html_document,
            encoding="utf-8",
        )

        github_output = os.getenv(
            "GITHUB_OUTPUT"
        )

        if github_output:
            with Path(
                github_output
            ).open(
                "a",
                encoding="utf-8",
            ) as output_handle:
                output_handle.write(
                    f"status={status}\n"
                )
                output_handle.write(
                    f"percentage={percentage}\n"
                )

        print(
            f"Coverage status: {status}"
        )
        print(
            f"Coverage percentage: {percentage}"
        )
        print(
            f"Generated: {json_output}"
        )
        print(
            f"Generated: {yaml_output}"
        )
        print(
            f"Generated: {html_output}"
        )
        PY

    - name: Validate coverage evidence
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail

        required_files=(
          "$OUTPUT_DIRECTORY/coverage-status.json"
          "$OUTPUT_DIRECTORY/coverage-status.yaml"
          "$OUTPUT_DIRECTORY/coverage-report.html"
        )

        for file in "${required_files[@]}"; do
          test -s "$file" || {
            echo "::error::Coverage evidence is missing: $file"
            exit 1
          }
        done

    - name: Fail when coverage is below threshold
      if: ${{ steps.coverage.outputs.status == 'failed' }}
      shell: bash
      run: |
        set -euo pipefail

        echo "::error::Coverage is below the configured threshold"
        exit 1