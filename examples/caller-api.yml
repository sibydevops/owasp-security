name: Organization OWASP API Security
on: [push, pull_request]
jobs:
  scan:
    uses: ORG/security-workflows/.github/workflows/reusable-security.yml@main
    with:
      app_type: api
      target_url: https://api-test.example.internal
      openapi_url: https://api-test.example.internal/openapi.json
      dast_mode: api
    secrets: inherit
